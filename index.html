<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Piano Game</title>
</head>

<body>

<div class="piano">

  <!-- WHITE KEYS WITH BLACK KEYS POSITIONED -->
  <!-- C -->
  <div class="white">C</div>
  <div class="black" style="left:45px;">C#</div>

  <!-- D -->
  <div class="white">D</div>
  <div class="black" style="left:105px;">D#</div>

  <!-- E -->
  <div class="white">E</div>

  <!-- F -->
  <div class="white">F</div>
  <div class="black" style="left:225px;">F#</div>

  <!-- G -->
  <div class="white">G</div>
  <div class="black" style="left:285px;">G#</div>

  <!-- A -->
  <div class="white">A</div>
  <div class="black" style="left:345px;">A#</div>

  <!-- B -->
  <div class="white">B</div>

  <!-- NEXT OCTAVE -->

  <div class="white">C</div>
  <div class="black" style="left:465px;">C#</div>

  <div class="white">D</div>
  <div class="black" style="left:525px;">D#</div>

  <div class="white">E</div>

  <div class="white">F</div>
  <div class="black" style="left:645px;">F#</div>

  <div class="white">G</div>
  <div class="black" style="left:705px;">G#</div>

  <div class="white">A</div>
  <div class="black" style="left:765px;">A#</div>

  <div class="white">B</div>

</div>


<script src="script.js"></script>

</body>
</html>
